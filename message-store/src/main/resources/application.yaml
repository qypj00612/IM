mybatis-plus:
  mapper-locations: classpath:**/mapper/*.xml
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: NONE
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lld.im.service.user.dao: debug
    com.baomidou.mybatisplus: debug

rocketmq:
  name-server: 192.168.181.128:9876
  producer:
    group: default
    send-message-timeout: 15000  # 延长到15秒，适配容器
    retry-times-when-send-failed: 5  # 增加重试
    retry-times-when-send-async-failed: 5
    max-message-size: 4194304  # 增大消息体限制（避免大消息被拒绝）
  consumer:
    pull-batch-size: 10000