im:
  tcpPort: 8001
  webSocketPort: 18001
  bossThreadSize: 1
  workerThreadSize: 8
  hearBeatTime: 3000
  brokerId: 1001
  loginModel: 3

  loginUrl: http://127.0.0.1:8000/v1
  #  * 多端同步模式：1 只允许一端在线，手机/电脑/web 踢掉除了本client+imel的设备
  #  *            2 允许手机/电脑的一台设备 + web在线 踢掉除了本client+imel的非web端设备
  #  *            3 允许手机和电脑单设备 + web 同时在线 踢掉非本client+imel的同端设备
  #  *            4 允许所有端多设备登录 不踢任何设备

  redis:
    mode: single # 单机模式：single 哨兵模式：sentinel 集群模式：cluster
    database: 0
    password: 123
    timeout: 3000 # 超时时间
    poolMinIdle: 8 #最小空闲数
    poolConnTimeout: 3000 # 连接超时时间(毫秒)
    poolSize: 10 # 连接池大小
    single: #redis单机配置
      address: 192.168.181.128:6379

  rocketmq:
    address: 192.168.181.128:9876

  nacos:
    address: 192.168.181.128:8848
    namespace: c65a45b8-9b55-4b53-9e10-fbab776f8db6
    username: nacos
    password: nacos
